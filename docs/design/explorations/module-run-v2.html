document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>gunk — run console<\u002Ftitle>\n<style>\n  :root {\n    --bg:        #141416;\n    --text:      #f3f3f5;\n    --muted:     #9b9ba2;\n    --faint:     #6c6c74;\n    --fainter:   #4a4a51;\n    --line:      rgba(255,255,255,0.07);\n    --line-2:    rgba(255,255,255,0.045);\n    --green:     #5fe08c;\n    --amber:     #e7b765;\n    --red:       #e5786a;\n    --violet:    #b79be0;\n    --sky:       #7fb6e8;\n\n    /* console palette — its own near-black world, deeper than the page */\n    --con:       #0c0c0e;\n    --con-hi:    #131316;\n    --con-line:  rgba(255,255,255,0.06);\n\n    --sans: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"SF Pro Display\", system-ui, \"Segoe UI\", sans-serif;\n    --mono: \"SF Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n  }\n  * { box-sizing: border-box; }\n  html, body { height: 100%; }\n  body {\n    margin: 0; font-family: var(--sans); color: var(--text);\n    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;\n    background:\n      radial-gradient(130% 100% at 18% -10%, #1d1d21 0%, transparent 55%),\n      linear-gradient(180deg, #141416, #111113);\n    background-color: #141416;\n    display: grid; place-items: center; overflow: hidden;\n  }\n\n  .window {\n    position: relative; width: min(1340px, 96vw); height: min(872px, 94vh);\n    border-radius: 22px; overflow: hidden; background: var(--bg);\n    box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 48px 130px -24px rgba(0,0,0,0.85);\n    isolation: isolate;\n  }\n\n  /* ---------- glass bar ---------- */\n  .bar {\n    position: absolute; top: 0; left: 0; right: 0; z-index: 10; height: 54px;\n    display: flex; align-items: center; gap: 13px; padding: 0 18px 0 86px;\n    background: rgba(18,18,21,0.6);\n    -webkit-backdrop-filter: blur(40px) saturate(1.7); backdrop-filter: blur(40px) saturate(1.7);\n    border-bottom: 1px solid rgba(255,255,255,0.055);\n  }\n  .traffic { position: absolute; top: 21px; left: 22px; display: flex; gap: 8px; }\n  .traffic i { width: 12px; height: 12px; border-radius: 50%; }\n  .traffic .r { background:#ff5f57; } .traffic .y { background:#febc2e; } .traffic .g { background:#28c840; }\n  .back { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; flex: none; font-size: 13px; font-weight: 600; color: var(--text); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09); border-radius: 9px; padding: 6px 11px 6px 8px; transition: background .14s; }\n  .back:hover { background: rgba(255,255,255,0.11); }\n  .back svg { width: 15px; height: 15px; }\n  .crumb { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12.5px; color: var(--faint); }\n  .crumb svg { width: 11px; height: 11px; opacity: .5; flex: none; }\n  .crumb .cur { color: var(--text); font-weight: 500; white-space: nowrap; }\n  .bar .grow { flex: 1; }\n  .bar-state { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }\n  .bar-state .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }\n  .bar-state.ready { color: var(--green); } .bar-state.ready .dot { background: var(--green); box-shadow: 0 0 8px rgba(95,224,140,.6); }\n  .bar-state.attn { color: var(--amber); } .bar-state.attn .dot { background: var(--amber); }\n\n  .scroll { position: absolute; inset: 54px 0 0; overflow-y: auto; }\n  .scroll::-webkit-scrollbar { width: 11px; }\n  .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }\n  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 40px 40px; }\n\n  /* ---------- slim title row (does NOT compete with console) ---------- */\n  .title { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; }\n  .title .tl { min-width: 0; }\n  .title h1 { font-size: 23px; font-weight: 600; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }\n  .title .pp { font-size: 13.5px; color: var(--muted); margin: 7px 0 0; line-height: 1.45; max-width: 70ch; text-wrap: pretty; }\n  .title .badge { flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: var(--muted); }\n  .title .badge .lang { color: var(--sky); }\n\n  /* ============================================================\n     THE HERO — run console. Big, deep, the locus of everything.\n     ============================================================ */\n  .stage { display: grid; grid-template-columns: minmax(0,1.72fr) minmax(280px,0.92fr); gap: 34px; align-items: start; }\n  @media (max-width: 940px) { .stage { grid-template-columns: 1fr; gap: 26px; } }\n\n  .console {\n    border-radius: 16px; overflow: hidden; background: var(--con);\n    border: 1px solid rgba(255,255,255,0.08);\n    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 30px 70px -30px rgba(0,0,0,0.95), 0 0 0 1px rgba(0,0,0,0.4);\n  }\n  .con-bar { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-bottom: 1px solid var(--con-line); background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent); }\n  .con-bar .ci { width: 15px; height: 15px; color: var(--faint); }\n  .con-bar .ct { font-size: 12.5px; font-weight: 600; letter-spacing: .01em; }\n  .con-bar .cdot { width: 5px; height: 5px; border-radius: 50%; background: var(--fainter); }\n  .con-bar .cf { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }\n  .con-bar .chip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }\n  .con-bar .chip svg { width: 11px; height: 11px; }\n  .con-bar .chip.idle { background: rgba(255,255,255,0.05); color: var(--faint); }\n  .con-bar .chip.running { background: rgba(127,182,232,0.14); color: var(--sky); }\n  .con-bar .chip.pass { background: rgba(95,224,140,0.16); color: var(--green); }\n  .con-bar .chip.fail { background: rgba(229,120,106,0.16); color: var(--red); }\n  .con-bar .chip .rspin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(127,182,232,0.3); border-top-color: var(--sky); animation: spin .8s linear infinite; }\n  @keyframes spin { to { transform: rotate(360deg); } }\n\n  /* intent toolbar — these are the \"verbs\" that compose the command */\n  .con-tools { display: flex; align-items: center; gap: 4px; padding: 11px 13px; border-bottom: 1px solid var(--con-line); }\n  .vtab { display: inline-flex; align-items: center; gap: 7px; font-family: var(--sans); font-size: 12.5px; font-weight: 600; color: var(--faint); background: transparent; border: none; border-radius: 8px; padding: 7px 11px; cursor: pointer; transition: background .14s, color .14s; }\n  .vtab svg { width: 13px; height: 13px; }\n  .vtab:hover { color: var(--muted); background: rgba(255,255,255,0.03); }\n  .vtab.on { color: var(--text); background: rgba(255,255,255,0.07); }\n  .vtab.on.ex { color: var(--green); } .vtab.on.brk { color: var(--amber); }\n  .con-tools .spacer { flex: 1; }\n  .con-tools .swap { font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: var(--faint); background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 6px 8px; border-radius: 7px; }\n  .con-tools .swap:hover { color: var(--text); background: rgba(255,255,255,0.04); }\n  .con-tools .swap svg { width: 12px; height: 12px; }\n\n  /* the console body — command line + streamed output live here */\n  .con-body { padding: 17px 18px; min-height: 252px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }\n  .cmdline { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }\n  .cmdline .pr { color: var(--green); flex: none; }\n  .cmd { color: var(--text); }\n  .cmd .flag { color: var(--faint); }\n  .cmd .arg { color: var(--sky); position: relative; }\n  .cmd .arg.break { color: var(--amber); }\n  .caret { display: inline-block; width: 7px; height: 14px; background: var(--muted); vertical-align: -2px; animation: blink 1s steps(1) infinite; margin-left: 2px; }\n  @keyframes blink { 50% { opacity: 0; } }\n  .stdout { margin-top: 12px; }\n  .stdout .tl { white-space: pre-wrap; word-break: break-word; }\n  .stdout .tl.meta { color: var(--faint); }\n  .stdout .tl.out { color: var(--muted); }\n  .stdout .tl.ok { color: var(--green); }\n  .stdout .tl.err { color: var(--red); }\n\n  .con-hint { margin-top: 14px; display: flex; align-items: flex-start; gap: 9px; font-family: var(--sans); font-size: 12.5px; color: var(--faint); line-height: 1.5; padding-top: 14px; border-top: 1px dashed var(--con-line); }\n  .con-hint svg { width: 15px; height: 15px; flex: none; margin-top: 1px; opacity: .8; }\n  .con-hint b { color: var(--muted); font-weight: 600; }\n\n  /* the diff receipt — rendered as terminal text, NOT boxes */\n  .diff { margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--con-line); }\n  .diff .dh { display: flex; align-items: center; gap: 8px; font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-bottom: 11px; }\n  .diff .dh .arrow { width: 13px; height: 13px; color: var(--faint); }\n  .diff .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }\n  .diff .col { min-width: 0; padding: 0 16px; }\n  .diff .col.l { border-right: 1px solid var(--con-line); padding-left: 0; }\n  .diff .col.r { padding-right: 0; }\n  .diff .cl { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }\n  .diff .cl.before { color: var(--faint); }\n  .diff .cl.after { color: var(--green); }\n  .diff .cl svg { width: 11px; height: 11px; }\n  .diff .body { font-size: 11.5px; line-height: 1.6; max-height: 150px; overflow: auto; }\n  .diff .body.before { color: var(--faint); }\n  .diff .body.before .h3 { color: var(--muted); font-weight: 600; }\n  .diff .body.after { color: var(--muted); white-space: pre-wrap; word-break: break-word; }\n  .diff .body.after .add { color: var(--green); }\n\n  /* console footer — the single action zone. Cycles Run → verdict. */\n  .con-foot { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-top: 1px solid var(--con-line); background: linear-gradient(180deg, transparent, rgba(255,255,255,0.018)); min-height: 60px; }\n  .con-foot .fnote { font-family: var(--sans); font-size: 11.5px; color: var(--faint); line-height: 1.4; }\n  .con-foot .fnote b { color: var(--muted); font-weight: 600; }\n  .runbtn { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 9px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; border: none; border-radius: 11px; padding: 11px 22px; background: var(--green); color: #06301a; box-shadow: 0 12px 28px -12px rgba(95,224,140,.6); transition: transform .07s, background .14s; }\n  .runbtn:hover { background: #74e89c; } .runbtn:active { transform: translateY(1px); }\n  .runbtn svg { width: 15px; height: 15px; }\n  .runbtn.brk { background: var(--amber); color: #3a2c08; box-shadow: 0 12px 28px -12px rgba(231,183,101,.55); }\n  .runbtn.brk:hover { background: #efc77c; }\n  .runbtn.running { background: rgba(255,255,255,0.08); color: var(--muted); box-shadow: none; cursor: default; }\n\n  /* the verdict, living in the console footer */\n  .vask { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text); }\n  .vask .s { display: block; font-size: 11.5px; font-weight: 400; color: var(--faint); margin-top: 3px; }\n  .vbtns { margin-left: auto; display: flex; gap: 9px; flex: none; }\n  .vbtn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; border: none; border-radius: 10px; padding: 9px 15px; transition: transform .06s, background .14s, color .14s; }\n  .vbtn:active { transform: translateY(1px); }\n  .vbtn svg { width: 14px; height: 14px; }\n  .vbtn.right { background: var(--green); color: #06301a; } .vbtn.right:hover { background: #74e89c; }\n  .vbtn.wrong { background: rgba(255,255,255,0.07); color: var(--text); } .vbtn.wrong:hover { background: rgba(229,120,106,0.16); color: #f0a99e; }\n  .vbtn.amber { background: var(--amber); color: #3a2c08; } .vbtn.amber:hover { background: #efc77c; }\n\n  /* inline correction — appears in console body, terminal-styled */\n  .correct { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--con-line); }\n  .correct .ch { font-family: var(--sans); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }\n  .correct .ch svg { width: 15px; height: 15px; color: var(--muted); }\n  .correct .cs { font-family: var(--sans); font-size: 12px; color: var(--faint); line-height: 1.5; margin: 7px 0 11px; }\n  .correct .cs b { color: var(--muted); font-weight: 600; }\n  .correct textarea { width: 100%; min-height: 78px; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text); background: rgba(0,0,0,0.4); border: 1px solid var(--con-line); border-radius: 10px; padding: 10px 12px; outline: none; }\n  .correct .cnote { width: 100%; margin-top: 8px; font-family: var(--sans); font-size: 12.5px; color: var(--text); background: rgba(0,0,0,0.4); border: 1px solid var(--con-line); border-radius: 9px; padding: 9px 11px; outline: none; }\n  .correct .cnote::placeholder, .correct textarea::placeholder { color: var(--fainter); }\n  .correct .cf { display: flex; gap: 9px; margin-top: 11px; }\n  .pinbtn { font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; border: none; border-radius: 9px; padding: 9px 15px; background: var(--amber); color: #3a2c08; }\n  .ghostbtn { font-family: var(--sans); font-size: 12.5px; font-weight: 600; cursor: pointer; border: none; border-radius: 9px; padding: 9px 14px; background: rgba(255,255,255,0.07); color: var(--text); }\n  .ghostbtn:hover { background: rgba(255,255,255,0.12); }\n\n  /* ============================================================\n     COVERAGE LEDGER — airy, de-boxed. A spine, hairlines, lists.\n     ============================================================ */\n  .ledger { padding-top: 4px; }\n  .led-h { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }\n  .led-sub { font-size: 12px; color: var(--faint); line-height: 1.45; margin: 5px 0 0; }\n\n  /* class spine */\n  .spine { margin: 20px 0 4px; position: relative; }\n  .spine::before { content: \"\"; position: absolute; left: 9px; top: 14px; bottom: 14px; width: 1.5px; background: linear-gradient(180deg, var(--line), var(--line-2)); }\n  .node { position: relative; display: flex; align-items: flex-start; gap: 13px; padding: 9px 0 9px 0; cursor: default; }\n  .node.actionable { cursor: pointer; }\n  .node .dot { position: relative; z-index: 1; width: 19px; height: 19px; border-radius: 50%; flex: none; display: grid; place-items: center; margin-top: 1px; background: var(--bg); }\n  .node .dot .ring { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; }\n  .node .dot.ok .ring { background: var(--green); color: #06301a; }\n  .node .dot.ok svg { width: 12px; height: 12px; }\n  .node .dot.gap .ring { background: transparent; border: 1.5px dashed var(--fainter); }\n  .node .dot.gap .ring .inner { width: 5px; height: 5px; border-radius: 50%; background: var(--fainter); }\n  .node .dot.warn .ring { background: var(--amber); color: #3a2c08; }\n  .node .dot.warn svg { width: 11px; height: 11px; }\n  .node .nb { min-width: 0; flex: 1; }\n  .node .nn { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }\n  .node .nn .ct { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--faint); }\n  .node .nd { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }\n  .node .nd.gap { color: var(--faint); }\n  .node .test { font-size: 11.5px; font-weight: 600; color: var(--green); display: inline-flex; align-items: center; gap: 3px; opacity: 0; transition: opacity .14s; flex: none; margin-top: 1px; }\n  .node .test svg { width: 12px; height: 12px; }\n  .node.actionable:hover .test { opacity: 1; }\n  .node.actionable:hover .nn { color: #fff; }\n\n  /* sub-lists, hairline separated, no cards */\n  .led-sec { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }\n  .led-sec .lsh { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }\n  .led-sec .lsh svg { width: 12px; height: 12px; }\n  .led-sec .lsh .n { margin-left: auto; font-family: var(--mono); letter-spacing: 0; }\n  .led-sec.fail .lsh { color: var(--red); }\n\n  .lrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }\n  .lrow:last-child { border-bottom: none; }\n  .lrow .lm { width: 6px; height: 6px; border-radius: 50%; flex: none; }\n  .lrow .lm.ok { background: var(--green); } .lrow .lm.fail { background: var(--red); }\n  .lrow .lb { min-width: 0; flex: 1; }\n  .lrow .ln { font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; }\n  .lrow .ln .brought { font-size: 9.5px; font-weight: 600; color: var(--violet); background: rgba(183,155,224,.13); border-radius: 4px; padding: 1px 5px; letter-spacing: .02em; }\n  .lrow .ls { font-size: 10.5px; color: var(--faint); margin-top: 2px; }\n  .lrow .la { font-family: var(--sans); font-size: 11.5px; font-weight: 600; border: none; border-radius: 7px; padding: 5px 10px; cursor: pointer; flex: none; }\n  .lrow .la.rerun { background: transparent; color: var(--faint); opacity: 0; transition: opacity .14s; }\n  .lrow:hover .la.rerun { opacity: 1; } .lrow .la.rerun:hover { color: var(--text); }\n  .lrow .la.fix { background: rgba(231,183,101,.15); color: var(--amber); display: inline-flex; align-items: center; gap: 5px; }\n  .lrow .la.fix svg { width: 12px; height: 12px; }\n  .lrow .fixing { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--sky); flex: none; }\n  .lrow .fixing .rspin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(127,182,232,.3); border-top-color: var(--sky); animation: spin .8s linear infinite; }\n\n  .limrow { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; font-size: 11.5px; color: var(--muted); line-height: 1.45; }\n  .limrow .ld { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); flex: none; margin-top: 6px; }\n  .limrow b { color: var(--text); font-weight: 600; }\n  .led-empty { font-size: 11.5px; color: var(--faint); line-height: 1.5; }\n\n  /* sign-off — a statement, not a card */\n  .signoff { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }\n  .signoff .st { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }\n  .signoff .st svg { width: 15px; height: 15px; }\n  .signoff.ready .st { color: var(--green); } .signoff.locked .st { color: var(--muted); }\n  .signoff .ss { font-size: 11.5px; color: var(--faint); line-height: 1.45; margin: 7px 0 13px; }\n  .signoff .sb { width: 100%; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; border: none; border-radius: 11px; padding: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }\n  .signoff .sb svg { width: 15px; height: 15px; }\n  .signoff.ready .sb { background: var(--green); color: #06301a; box-shadow: 0 12px 28px -14px rgba(95,224,140,.55); }\n  .signoff.ready .sb:hover { background: #74e89c; }\n  .signoff.locked .sb { background: rgba(255,255,255,0.05); color: var(--fainter); cursor: not-allowed; }\n\n  /* ============================================================\n     ADVANCED FOOTER — module details, fully demoted.\n     ============================================================ */\n  .advanced { margin-top: 30px; border-top: 1px solid var(--line); }\n  .advanced > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 11px; padding: 16px 2px; font-size: 12.5px; color: var(--faint); transition: color .14s; }\n  .advanced > summary::-webkit-details-marker { display: none; }\n  .advanced > summary:hover { color: var(--muted); }\n  .advanced > summary .gear { width: 14px; height: 14px; }\n  .advanced > summary .chev { width: 13px; height: 13px; margin-left: auto; transition: transform .2s; }\n  .advanced[open] > summary .chev { transform: rotate(90deg); }\n  .advanced > summary .gl { display: flex; gap: 14px; font-size: 11.5px; color: var(--fainter); }\n  .adv-body { padding: 2px 2px 26px; }\n  .adv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }\n  @media (max-width: 820px) { .adv-grid { grid-template-columns: repeat(2,1fr); gap: 22px; } }\n  .adv-sec h5 { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fainter); margin: 0 0 11px; }\n  .adv-row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 12px; }\n  .adv-row .k { color: var(--faint); width: 66px; flex: none; }\n  .adv-row .v { color: var(--muted); display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }\n  .mono { font-family: var(--mono); font-size: 11px; color: var(--muted); }\n  .adv-files { font-family: var(--mono); font-size: 11.5px; color: var(--muted); line-height: 2; }\n  .adv-files .f { display: flex; align-items: center; gap: 7px; } .adv-files .f svg { width: 11px; height: 11px; color: var(--faint); flex: none; }\n  .adv-trace { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 11.5px; color: va
