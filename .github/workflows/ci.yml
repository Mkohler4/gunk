name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash merges use the PR title as the commit subject, which feeds
          # release-please / the CHANGELOG. Enforce Conventional Commits.
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert)(\([a-z0-9_-]+\))?!?: .+$'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "PR title does not follow Conventional Commits:"
            echo "  $PR_TITLE"
            echo "Expected e.g. 'feat(app): add Dock recycling-bin icon'"
            exit 1
          fi

  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    steps:
      - name: no-changelog label present
        if: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: echo "CHANGELOG gate bypassed by the no-changelog label."

      - name: Check out repository
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF" HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "Code changed but CHANGELOG.md was not updated."
            echo "Add an entry under [Unreleased], or apply the 'no-changelog' label for pure refactors."
            exit 1
          fi

  docs-only:
    name: Docs-only change
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code != 'true'
    steps:
      - name: Skip package jobs
        run: echo "Only docs changed; package CI jobs are skipped."

  schema-parity:
    name: Schema parity
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Swift and MCP schema parity
        run: bash scripts/check-schema-parity.sh

  mcp:
    name: MCP
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  engine:
    name: Engine
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (includes eval gate vs baseline scorecard)
        run: bun test

  engine-binary:
    name: Engine binary
    runs-on: macos-14
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build

      - name: Smoke-test self-contained binary without Bun on PATH
        run: |
          if PATH=/usr/bin:/bin command -v bun; then
            echo "bun should not be available in the restricted smoke-test PATH"
            exit 1
          fi
          work="$(mktemp -d)"
          cp -R test/fixtures/express-saas "$work/proj"
          # Ollama is unreachable in CI, so the run fails at the survey LLM call.
          # The point of this smoke test is that scan/symbols/graph/fingerprints
          # (the embedded tree-sitter WASM grammars) run with no node_modules.
          set +e
          PATH=/usr/bin:/bin ./dist/gunk-engine "$work/proj" \
            --provider ollama --model llama3.2 \
            --db "$work/store.db" --gunk-home "$work/home" --json >"$work/out.ndjson" 2>"$work/err.log"
          set -e
          grep -q '"stage":"symbols","phase":"finished"' "$work/out.ndjson"
          grep -q '"stage":"graph","phase":"finished"' "$work/out.ndjson"
          grep -q '"stage":"fingerprints","phase":"finished"' "$work/out.ndjson"

  mcp-binary:
    name: MCP binary
    runs-on: macos-14
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build

      - name: Smoke-test binary without Bun on PATH
        run: |
          if PATH=/usr/bin:/bin command -v bun; then
            echo "bun should not be available in the restricted smoke-test PATH"
            exit 1
          fi
          fifo="$(mktemp -u)"
          output="$(mktemp)"
          mkfifo "$fifo"
          exec 3<>"$fifo"
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exec 3>&- || true
            rm -f "$fifo" "$output"
          }
          trap cleanup EXIT

          PATH=/usr/bin:/bin ./dist/gunk-mcp <&3 >"$output" &
          pid=$!

          kill -0 "$pid"

          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}' >&3
          for _ in 1 2 3 4 5; do
            grep -q '"id":1' "$output" && break
            sleep 1
          done
          grep -q '"id":1' "$output"

          printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' >&3
          printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' >&3
          for _ in 1 2 3 4 5; do
            grep -q '"id":2' "$output" && break
            sleep 1
          done
          grep -q '"id":2' "$output"

          for tool in list_gunks list_sources search_gunks get_gunk; do
            grep -q "\"name\":\"$tool\"" "$output"
          done

  app:
    name: App
    runs-on: macos-14
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version
        working-directory: .

      - name: Show Swift version
        run: swift --version
        working-directory: .

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  llm-live-smoke:
    name: LLM live smoke
    runs-on: macos-14
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run OpenAI live smoke when configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; skipping live LLM smoke."
            exit 0
          fi

          swift test --filter GunkAppTests.LLMClientTests/testOpenAILiveSmoke
