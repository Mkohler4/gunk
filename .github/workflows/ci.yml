name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash merges use the PR title as the commit subject, which feeds
          # release-please / the CHANGELOG. Enforce Conventional Commits.
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert)(\([a-z0-9_-]+\))?!?: .+$'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "PR title does not follow Conventional Commits:"
            echo "  $PR_TITLE"
            echo "Expected e.g. 'feat(app): add Dock recycling-bin icon'"
            exit 1
          fi

  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    steps:
      - name: no-changelog label present
        if: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: echo "CHANGELOG gate bypassed by the no-changelog label."

      - name: Check out repository
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF" HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "Code changed but CHANGELOG.md was not updated."
            echo "Add an entry under [Unreleased], or apply the 'no-changelog' label for pure refactors."
            exit 1
          fi

  docs-only:
    name: Docs-only change
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code != 'true'
    steps:
      - name: Skip package jobs
        run: echo "Only docs changed; package CI jobs are skipped."

  schema-parity:
    name: Schema parity
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Swift and MCP schema parity
        run: bash scripts/check-schema-parity.sh

  mcp:
    name: MCP
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  mcp-binary:
    name: MCP binary
    runs-on: macos-14
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build

      - name: Smoke-test binary without Bun on PATH
        run: |
          if PATH=/usr/bin:/bin command -v bun; then
            echo "bun should not be available in the restricted smoke-test PATH"
            exit 1
          fi
          fifo="$(mktemp -u)"
          mkfifo "$fifo"
          exec 3<>"$fifo"
          PATH=/usr/bin:/bin ./dist/gunk-mcp <&3 &
          pid=$!
          sleep 2
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || test "$?" -eq 143
          exec 3>&-
          rm "$fifo"

  app:
    name: App
    runs-on: macos-14
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version
        working-directory: .

      - name: Show Swift version
        run: swift --version
        working-directory: .

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  llm-live-smoke:
    name: LLM live smoke
    runs-on: macos-14
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run OpenAI live smoke when configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; skipping live LLM smoke."
            exit 0
          fi

          swift test --filter GunkAppTests.LLMClientTests/testOpenAILiveSmoke
